<div style="text-align: center; margin-top: 50px; font-family: Arial, sans-serif;">
  <h1>Hager's Todo List Project</h1>
  
  <div style="margin-bottom: 20px;">
    <input #taskInput type="text" placeholder="Add a new task..." style="padding: 8px; width: 250px; border: 1px solid #ccc; border-radius: 4px;">
    <button (click)="addTask(taskInput.value); taskInput.value=''" style="padding: 8px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 5px;">Add</button>
  </div>

  <ul style="list-style-type: none; padding: 0; width: 320px; margin: 0 auto; text-align: left;">
    <li *ngFor="let task of tasks; let i = index" style="padding: 10px; background-color: #f4f4f4; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;">
      <span>{{ task }}</span>
      <button (click)="deleteTask(i)" style="background-color: #dc3545; color: white; border: none; border-radius: 3px; cursor: pointer; padding: 3px 8px;">Delete</button>
    </li>
  </ul>
</div>
